<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <base href="/">
  <title>Art Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { margin: 0; background: #333; } canvas { width: 960px; height: 540px; }</style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="js/core.js"></script>
  <script src="js/art.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/world.js"></script>
  <script src="js/scenery.js"></script>
  <script>
    // Preview sheet for the unicorn and grown-ups: open /tools/art_preview.html
    S.t = 1.3;
    const A = new URLSearchParams(location.search).has('alarm');
    loadImages().then(() => {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.fillStyle = '#f4ecf8'; ctx.fillRect(0, 0, W, H);
      const looks = [
        [{ mane: 'natural', style: 'flowing', shine: 15 }, { mood: 'sad' }],
        [{ mane: 'rainbow', style: 'flowing', shine: 100, head: 'crown', neck: 'lei', back: 'wings', tail: 'tailflowers', hooves: 'pink' }, {}],
        [{ mane: 'lavender', style: 'topknot', shine: 100, head: 'tiara', neck: 'necklace', back: 'cape', tail: 'goldcuff', hooves: 'gold' }, { mood: 'joy' }],
        [{ mane: 'ocean', style: 'braid', shine: 90, head: 'shellcomb', neck: 'shells', back: 'shawl', tail: 'pearls', hooves: 'pearl' }, {}],
        [{ mane: 'midnight', style: 'curly', shine: 100, head: 'starclip', neck: 'starpendant', back: 'starcape', tail: 'tailstars', hooves: 'star' }, { mood: 'wow' }],
      ];
      looks.forEach(([look, o], i) => drawUnicorn(80 + i * 150, 250, 0.55, look, o));
      drawUnicorn(190, 530, 1.0, { mane: 'natural', style: 'flowing', shine: 100 }, {});
      drawPerson('mom', 440, 530, 1, 0.6, A, 0.72);
      drawPerson('ranger', 570, 530, -1, 0, !A, 0.72);
      drawPerson('neighbor', 690, 530, 1, 0, A, 0.72);
      drawPersonPortrait('mom', 800, 290, 108, 120, A);
      drawPersonPortrait('ranger', 800, 164, 108, 120, A);
      drawPersonPortrait('neighbor', 800, 416, 108, 120, !A);
    });
  </script>
</body>
</html>
