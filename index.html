<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aubrey &amp; the Secret Unicorn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #1b1030; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', 'Trebuchet MS', sans-serif; }
    #wrap { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; border-radius: 6px; }
    #nameBox { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(27, 16, 48, .55); }
    #nameBox[hidden] { display: none; }
    #nameBox form { background: #fff4fb; border: 4px solid #ff8fc8; border-radius: 18px; padding: 22px 28px; text-align: center; color: #5a2a6e; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
    #nameBox h2 { margin: 0 0 12px; font-size: 26px; }
    #nameBox input { font: inherit; font-size: 24px; padding: 8px 14px; border-radius: 10px; border: 2px solid #c6a2ff; width: 240px; text-align: center; color: #5a2a6e; }
    #nameBox button { font: inherit; font-size: 20px; font-weight: 600; margin-top: 14px; padding: 8px 26px; border-radius: 999px; border: 0; background: #ff6fb5; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="nameBox" hidden>
      <form id="nameForm">
        <h2>What will you name her?</h2>
        <input id="nameInput" maxlength="14" autocomplete="off"><br>
        <button type="submit">That's her name!</button>
      </form>
    </div>
  </div>
  <script src="js/core.js"></script>
